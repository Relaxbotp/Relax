<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RELAX BOT | تنصيب البوت</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        
        body {
            background-color: #050510;
            background-image: linear-gradient(rgba(5, 5, 16, 0.8), rgba(5, 5, 16, 0.9)), url('https://images.unsplash.com/photo-1618331835717-801e976710b2?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 15px; }

        /* القائمة العلوية */
        .top-nav { display: flex; justify-content: flex-end; }
        .nav-btn { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 50px; padding: 5px 15px 5px 5px; display: flex; align-items: center; gap: 10px; color: #fff; font-weight: bold; font-size: 14px; box-shadow: 0 0 10px rgba(0, 255, 255, 0.2); }
        .nav-btn img { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #00ffff; object-fit: cover;}

        /* الهيدر (اللوجو) */
        .header { text-align: center; margin-top: 10px; position: relative; }
        .avatar-container { width: 120px; height: 120px; margin: 0 auto; border-radius: 50%; padding: 5px; background: linear-gradient(45deg, #00ffff, #0055ff); box-shadow: 0 0 30px rgba(0, 255, 255, 0.5); position: relative; }
        .avatar-container img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #000; }
        .header h1 { font-size: 28px; font-weight: 900; margin-top: 15px; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); letter-spacing: 2px; }
        .header p { font-size: 13px; color: #ccc; margin-top: 5px; }

        /* كروت الإحصائيات */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px; }
        .stat-card { background: rgba(0, 0, 0, 0.6); border-radius: 15px; padding: 15px 5px; text-align: center; backdrop-filter: blur(10px); }
        .stat-card h2 { font-size: 24px; margin-bottom: 5px; }
        .stat-card p { font-size: 11px; color: #aaa; font-weight: bold; }
        .stat-pink { border: 1px solid rgba(255, 0, 128, 0.5); box-shadow: inset 0 0 15px rgba(255, 0, 128, 0.1); }
        .stat-pink h2 { color: #ff0080; }
        .stat-green { border: 1px solid rgba(0, 255, 128, 0.5); box-shadow: inset 0 0 15px rgba(0, 255, 128, 0.1); }
        .stat-green h2 { color: #00ff80; }
        .stat-blue { border: 1px solid rgba(0, 128, 255, 0.5); box-shadow: inset 0 0 15px rgba(0, 128, 255, 0.1); }
        .stat-blue h2 { color: #0088ff; }

        /* كارت التنصيب */
        .main-card { background: rgba(10, 20, 30, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 25px 20px; backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); margin-top: 10px; }
        .main-card h3 { text-align: right; font-size: 16px; margin-bottom: 15px; }
        .input-group { position: relative; margin-bottom: 10px; }
        .input-group input { width: 100%; padding: 15px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #fff; font-size: 16px; text-align: right; outline: none; }
        .input-group input::placeholder { color: #666; font-family: sans-serif; }
        .hint-text { font-size: 11px; color: #888; text-align: right; margin-bottom: 20px; }
        .submit-btn { width: 100%; padding: 15px; background: linear-gradient(90deg, #0077ff, #00ffff); border: none; border-radius: 12px; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(0, 255, 255, 0.3); transition: 0.3s; }
        .submit-btn:hover { transform: scale(1.02); box-shadow: 0 8px 25px rgba(0, 255, 255, 0.5); }

        /* أزرار سفلية */
        .menu-btn { background: rgba(10, 20, 30, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 15px; display: flex; justify-content: space-between; align-items: center; color: #fff; text-decoration: none; backdrop-filter: blur(10px); transition: 0.3s; cursor: pointer; }
        .menu-btn:hover { background: rgba(20, 30, 40, 0.9); }
        .menu-btn-text { text-align: right; }
        .menu-btn-text h4 { font-size: 15px; margin-bottom: 3px; }
        .menu-btn-text p { font-size: 11px; color: #888; }
        .menu-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 20px; }

        .footer { text-align: center; font-size: 12px; color: #666; margin-top: 20px; padding-bottom: 20px; }

        /* ================= شات المطور العايم ================= */
        .chat-fab { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: linear-gradient(135deg, #00a884, #005c4b); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 168, 132, 0.4); z-index: 9999; transition: 0.3s; }
        .chat-fab:hover { transform: scale(1.1); }
        
        .chat-modal { position: fixed; bottom: 90px; right: 20px; width: 350px; max-width: calc(100vw - 40px); height: 500px; max-height: calc(100vh - 100px); background: #111b21; border: 1px solid #2a3942; border-radius: 15px; display: none; flex-direction: column; z-index: 9999; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .chat-modal.active { display: flex; }
        
        .chat-header { background: #202c33; padding: 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #111b21; color: white; cursor: pointer; }
        .chat-header .avatar { font-size: 24px; }
        .chat-header h4 { font-size: 16px; margin: 0; }
        .chat-header p { font-size: 12px; color: #00a884; margin: 0; }

        .chat-body { flex: 1; padding: 15px; overflow-y: auto; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-size: cover; display: flex; flex-direction: column; gap: 10px; }
        
        .chat-msg { max-width: 80%; padding: 10px 15px; border-radius: 10px; font-size: 14px; line-height: 1.5; word-wrap: break-word; color: white; }
        .chat-msg.user { background: #005c4b; align-self: flex-end; border-top-right-radius: 0; }
        .chat-msg.dev { background: #202c33; align-self: flex-start; border-top-left-radius: 0; }
        .chat-msg .time { font-size: 10px; color: rgba(255,255,255,0.6); display: block; text-align: left; margin-top: 5px; }

        .chat-footer { background: #202c33; padding: 10px; display: flex; gap: 10px; align-items: center; }
        .chat-footer input { flex: 1; background: #2a3942; border: none; padding: 12px; border-radius: 10px; color: white; outline: none; font-family: 'Cairo', sans-serif; }
        .chat-footer button { background: #00a884; border: none; width: 45px; height: 45px; border-radius: 50%; color: white; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-nav">
            <div class="nav-btn">
                <span>RELAX BOT</span>
                <img src="https://i.pinimg.com/736x/8f/1a/64/8f1a64e6c75e224499e6f4983a88493b.jpg" alt="Logo">
            </div>
        </div>

        <div class="header">
            <div class="avatar-container">
                <img src="https://i.pinimg.com/736x/8f/1a/64/8f1a64e6c75e224499e6f4983a88493b.jpg" alt="RELAX">
            </div>
            <h1>RELAX BOT</h1>
            <p>احصل على بوت واتساب خاص بك في ثواني</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card stat-blue">
                <h2>119</h2>
                <p>بوتات مثبتة</p>
            </div>
            <div class="stat-card stat-green">
                <h2>119</h2>
                <p>متصلة الآن</p>
            </div>
            <div class="stat-card stat-pink">
                <h2>1</h2>
                <p>أماكن متاحة</p>
            </div>
        </div>

        <div class="main-card">
            <h3>رقم واتساب</h3>
            <div class="input-group">
                <input type="text" id="phoneInput" placeholder="201234567890">
            </div>
            <div class="hint-text">اكتب رقمك مع رمز الدولة، من غير + أو مسافات.</div>
            <button class="submit-btn" id="submitBtn" onclick="generateCode()">تنصيب البوت</button>
        </div>

        <div class="menu-btn" onclick="toggleChat()">
            <div class="menu-icon" style="background: rgba(0, 200, 83, 0.2); color: #00c853;">💬</div>
            <div class="menu-btn-text">
                <h4>محادثة المطور</h4>
                <p>تكلم معه مباشرة (شات حقيقي)</p>
            </div>
            <div style="color: #666;">&lt;</div>
        </div>

        <div class="footer">RELAX SYSTEM © 2026</div>
    </div>

    <!-- ============ واجهة الشات (مخفية) ============ -->
    <div class="chat-fab" onclick="toggleChat()">💬</div>

    <div class="chat-modal" id="chatModal">
        <div class="chat-header" onclick="toggleChat()">
            <div class="avatar">🧑‍💻</div>
            <div>
                <h4 id="chatHeaderTitle">الدعم الفني | Relax</h4>
                <p id="chatStatus">متصل الآن</p>
            </div>
        </div>
        <div class="chat-body" id="chatBody">
            <!-- الرسايل هتظهر هنا -->
        </div>
        <div class="chat-footer">
            <input type="text" id="chatInput" placeholder="اكتب رسالتك..." onkeypress="handleChatEnter(event)">
            <button onclick="sendChatMessage()">➤</button>
        </div>
    </div>

    <!-- ============ كود التنصيب ============ -->
    <script>
        async function generateCode() {
            const phoneInput = document.getElementById('phoneInput').value.trim();
            const btn = document.getElementById('submitBtn');

            if (!phoneInput) {
                alert('يرجى إدخال رقم الهاتف أولاً!');
                return;
            }

            btn.innerText = 'جاري التوليد...';
            btn.disabled = true;

            try {
                // ⚠️ تم تحديث الرابط الجديد هنا
                const BOT_API_URL = 'https://radar-pioneer-extensions-sail.trycloudflare.com/api/pair';
                
                const response = await fetch(BOT_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phoneInput })
                });

                const data = await response.json();

                if (data.code) {
                    alert(`✅ كود التنصيب الخاص بك:\n\n${data.code}\n\nقم بنسخه وربطه في واتساب.`);
                } else {
                    throw new Error(data.error || 'حدث خطأ غير متوقع');
                }

            } catch (error) {
                alert(error.message || 'تعذر الاتصال بالسيرفر. تأكد أن البوت شغال.');
            } finally {
                btn.innerText = 'تنصيب البوت';
                btn.disabled = false;
            }
        }
    </script>

    <!-- ============ كود شات الفايربيز ============ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // إعدادات فايربيز بتاعتك
        const firebaseConfig = {
            apiKey: "AIzaSyBxdcYywv3ljnR4MMiYw6UammlfFVFmLA4",
            authDomain: "relax-chat-72d0d.firebaseapp.com",
            databaseURL: "https://relax-chat-72d0d-default-rtdb.firebaseio.com",
            projectId: "relax-chat-72d0d",
            storageBucket: "relax-chat-72d0d.firebasestorage.app",
            messagingSenderId: "589292109",
            appId: "1:589292109:web:ff9296d174810cf34c7204"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const chatRef = ref(db, 'relax_chat_room');

        const chatBody = document.getElementById('chatBody');
        const chatInput = document.getElementById('chatInput');
        
        // هل إنت المطور؟ (لو فتحت الموقع وفيه ?admin=true في الرابط)
        const isAdmin = window.location.search.includes('admin=true');
        
        if (isAdmin) {
            document.getElementById('chatHeaderTitle').innerText = 'أنت المطور (وضع الإدارة)';
            document.getElementById('chatStatus').innerText = 'ترد على العملاء';
            document.getElementById('chatStatus').style.color = 'orange';
        }

        // فتح وقفل الشات
        window.toggleChat = function() {
            const modal = document.getElementById('chatModal');
            modal.classList.toggle('active');
            if(modal.classList.contains('active')) {
                chatBody.scrollTop = chatBody.scrollHeight;
                chatInput.focus();
            }
        }

        // إرسال رسالة
        window.sendChatMessage = async function() {
            const text = chatInput.value.trim();
            if (!text) return;

            chatInput.value = '';
            
            try {
                await push(chatRef, {
                    sender: isAdmin ? 'dev' : 'user',
                    text: text,
                    time: Date.now()
                });
            } catch(e) {
                alert("حدث خطأ في الإرسال، تأكد من اتصالك بالإنترنت.");
            }
        }

        // إرسال بزر Enter
        window.handleChatEnter = function(e) {
            if (e.key === 'Enter') window.sendChatMessage();
        }

        // استقبال الرسايل لايف
        onChildAdded(chatRef, (snapshot) => {
            const data = snapshot.val();
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-msg ${data.sender === 'user' ? 'user' : 'dev'}`;
            
            const timeStr = new Date(data.time).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            msgDiv.innerHTML = `${data.text} <span class="time">${timeStr}</span>`;
            
            chatBody.appendChild(msgDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        });
    </script>

</body>
</html>
