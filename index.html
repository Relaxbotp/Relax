<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Player | مشغل الفيديوهات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --panel: #121216;
            --primary: #8b5cf6; /* نيون بنفسجي */
            --secondary: #06b6d4; /* نيون سماوي */
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; overflow-x: hidden; }

        /* خلفية متحركة خفيفة */
        .glow-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; }
        .glow-bg::before { content: ''; position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 70%); top: -20%; left: -10%; filter: blur(60px); animation: float 10s infinite alternate; }
        .glow-bg::after { content: ''; position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(6,182,212,0.1) 0%, transparent 70%); bottom: -20%; right: -10%; filter: blur(60px); animation: float 12s infinite alternate-reverse; }
        @keyframes float { 100% { transform: translate(50px, 50px); } }

        header { text-align: center; margin-bottom: 30px; margin-top: 20px; }
        header h1 { font-size: 32px; font-weight: 900; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        header p { color: var(--text-muted); font-size: 14px; }

        /* صندوق البحث */
        .search-box { width: 100%; max-width: 800px; display: flex; gap: 10px; margin-bottom: 30px; z-index: 10; }
        .search-box input {
            flex: 1; padding: 16px 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03); color: #fff; font-size: 16px; outline: none; transition: 0.3s; font-family: 'Cairo';
        }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(139,92,246,0.2); background: rgba(255,255,255,0.05); }
        .search-box button {
            padding: 0 30px; border: none; border-radius: 15px; background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .search-box button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(139,92,246,0.3); }

        /* مشغل الفيديو */
        .player-container {
            width: 100%; max-width: 900px; background: var(--panel); border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05); overflow: hidden; position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: none; flex-direction: column;
        }
        .player-container.active { display: flex; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .video-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; display: flex; justify-content: center; align-items: center; }
        .video-wrapper iframe, .video-wrapper video { width: 100%; height: 100%; border: none; object-fit: contain; }

        .controls { padding: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; background: #1a1a20; }
        .quality-selector { display: flex; align-items: center; gap: 10px; }
        .quality-selector label { font-size: 14px; color: var(--text-muted); font-weight: bold; }
        .quality-selector select {
            padding: 10px 15px; border-radius: 10px; background: #000; color: #fff; border: 1px solid var(--primary);
            outline: none; font-family: 'Cairo'; font-size: 14px; cursor: pointer;
        }

        .status-text { font-size: 14px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        .status-text.success { color: #10b981; }
        .status-text.error { color: #ef4444; }

        /* رسالة الخطأ */
        .error-msg { width: 100%; max-width: 800px; padding: 15px; border-radius: 10px; background: rgba(239,68,68,0.1); border: 1px solid #ef4444; color: #ef4444; text-align: center; display: none; margin-bottom: 20px; font-weight: bold; }
        .error-msg.active { display: block; animation: fadeIn 0.3s; }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <header>
        <h1>Cinematic Player</h1>
        <p>ضع رابط الفيديو (يوتيوب، تيك توك، أو رابط MP4 مباشر) وشاهده بجودة عالية</p>
    </header>

    <div class="error-msg" id="errorMsg"></div>

    <div class="search-box">
        <input type="text" id="videoUrl" placeholder="الصق الرابط هنا... (مثال: https://youtu.be/...)" onkeypress="handleEnter(event)">
        <button onclick="loadVideo()">تشغيل ▶</button>
    </div>

    <div class="player-container" id="playerContainer">
        <div class="video-wrapper" id="videoWrapper">
            <!-- الفيديو أو الـ iframe هيتحط هنا -->
        </div>
        <div class="controls">
            <div class="status-text" id="statusText">جاهز للتشغيل</div>
            
            <div class="quality-selector" id="qualityBox" style="display: none;">
                <label>الجودة:</label>
                <select id="qualitySelect" onchange="changeQuality()">
                    <!-- الخيارات هتتحط هنا بالـ JS -->
                </select>
            </div>
        </div>
    </div>

    <script>
        const videoUrlInput = document.getElementById('videoUrl');
        const playerContainer = document.getElementById('playerContainer');
        const videoWrapper = document.getElementById('videoWrapper');
        const statusText = document.getElementById('statusText');
        const errorMsg = document.getElementById('errorMsg');
        const qualityBox = document.getElementById('qualityBox');
        const qualitySelect = document.getElementById('qualitySelect');

        let currentTikTokData = null; // لحفظ بيانات الفيديو لو تيك توك

        function handleEnter(e) {
            if (e.key === 'Enter') loadVideo();
        }

        function showError(msg) {
            errorMsg.innerText = msg;
            errorMsg.classList.add('active');
            playerContainer.classList.remove('active');
            setTimeout(() => errorMsg.classList.remove('active'), 5000);
        }

        async function loadVideo() {
            const url = videoUrlInput.value.trim();
            errorMsg.classList.remove('active');
            qualityBox.style.display = 'none';

            if (!url) return showError('الرجاء إدخال رابط الفيديو أولاً.');

            playerContainer.classList.add('active');
            videoWrapper.innerHTML = '<div style="color:#fff; font-weight:bold;">⏳ جاري جلب الفيديو...</div>';
            statusText.innerText = 'جاري التحميل...';
            statusText.className = 'status-text';

            try {
                // 1. لو الرابط يوتيوب
                if (url.includes('youtube.com') || url.includes('youtu.be')) {
                    let videoId = '';
                    if (url.includes('youtu.be')) {
                        videoId = url.split('youtu.be/')[1].split('?')[0];
                    } else {
                        const urlParams = new URLSearchParams(new URL(url).search);
                        videoId = urlParams.get('v');
                    }
                    
                    if (!videoId) throw new Error("رابط يوتيوب غير صالح");

                    // يوتيوب بيشتغل بـ iframe بس (بيتحكم في الجودة لوحده)
                    videoWrapper.innerHTML = `
                        <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                    `;
                    statusText.innerText = 'يتم التشغيل من يوتيوب (الجودة تلقائية)';
                    statusText.classList.add('success');
                }
                
                // 2. لو الرابط تيك توك
                else if (url.includes('tiktok.com')) {
                    const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
                    const data = await response.json();

                    if (data.code !== 0) throw new Error("مقدرتش أجيب الفيديو من تيك توك، تأكد من اللينك.");

                    currentTikTokData = data.data;

                    // إعداد قائمة الجودات
                    qualitySelect.innerHTML = '';
                    if (currentTikTokData.hdplay) {
                        qualitySelect.innerHTML += `<option value="hd">HD (عالي)</option>`;
                    }
                    if (currentTikTokData.play) {
                        qualitySelect.innerHTML += `<option value="sd">SD (عادي)</option>`;
                    }
                    if (currentTikTokData.music) {
                         qualitySelect.innerHTML += `<option value="audio">صوت فقط (MP3)</option>`;
                    }
                    
                    qualityBox.style.display = 'flex';
                    playTikTokVideo('hd'); // تشغيل HD افتراضياً لو موجود

                    statusText.innerText = 'تم جلب الفيديو بنجاح من تيك توك';
                    statusText.classList.add('success');
                }

                // 3. لو رابط مباشر (MP4)
                else if (url.match(/\.(mp4|webm|ogg)$/i) || url.includes('.mp4')) {
                    videoWrapper.innerHTML = `
                        <video src="${url}" controls autoplay></video>
                    `;
                    statusText.innerText = 'يتم التشغيل كرابط مباشر';
                    statusText.classList.add('success');
                }

                // 4. روابط غير مدعومة
                else {
                    throw new Error("الموقع ده مش مدعوم حالياً. جرب يوتيوب أو تيك توك أو رابط MP4 مباشر.");
                }

            } catch (error) {
                showError(error.message);
                videoWrapper.innerHTML = '';
            }
        }

        function playTikTokVideo(type) {
            if (!currentTikTokData) return;

            if (type === 'hd' && currentTikTokData.hdplay) {
                videoWrapper.innerHTML = `<video src="${currentTikTokData.hdplay}" controls autoplay></video>`;
            } else if (type === 'sd' && currentTikTokData.play) {
                videoWrapper.innerHTML = `<video src="${currentTikTokData.play}" controls autoplay></video>`;
            } else if (type === 'audio' && currentTikTokData.music) {
                videoWrapper.innerHTML = `
                    <div style="text-align:center; padding: 20px; width: 100%;">
                        <img src="${currentTikTokData.cover}" style="width: 150px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);">
                        <br>
                        <audio src="${currentTikTokData.music}" controls autoplay style="width: 100%; max-width: 400px;"></audio>
                    </div>
                `;
            }
        }

        function changeQuality() {
            const selectedQuality = qualitySelect.value;
            playTikTokVideo(selectedQuality);
        }
    </script>
</body>
</html>
