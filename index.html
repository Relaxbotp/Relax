<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RELAX SYSTEM | تنصيب البوت</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at top right, #1a1a2e, #0d0d0d);
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: rgba(20, 20, 20, 0.8);
            padding: 30px 20px;
            border-radius: 20px;
            border: 1px solid #333;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            font-size: 18px;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #8a2be2, #00ffff);
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .btn:disabled {
            background: #333;
            cursor: not-allowed;
            transform: none;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            display: none;
        }

        .result-success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            color: #00ff00;
            display: block;
        }

        .result-error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff0000;
            color: #ff0000;
            display: block;
        }

        .dev-channel {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }

        .dev-channel a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #00ffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s;
        }

        .dev-channel a:hover {
            text-shadow: 0 0 10px #00ffff;
            color: #fff;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #666;
        }

        /* Loader Animation */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #00ffff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">RELAX</div>
        <div class="subtitle">يرجى إدخال رقمك لطلب كود التنصيب</div>

        <div class="input-group">
            <input type="text" id="phoneInput" placeholder="مثال: 201012345678" autocomplete="off">
        </div>

        <button class="btn" id="generateBtn" onclick="generateCode()">
            <span id="btnText">توليد الكود 🚀</span>
            <div class="loader" id="loader"></div>
        </button>

        <!-- مكان ظهور الكود أو الخطأ -->
        <div id="resultBox" class="result-box"></div>

        <!-- قناة المطور -->
        <div class="dev-channel">
            <a href="https://whatsapp.com/channel/0029Vb7cw1I1XqudPifLKz1A" target="_blank">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                انضم لقناة المطور
            </a>
        </div>

        <div class="footer">
            © RELAX SYSTEM 2026 جميع الحقوق محفوظة
        </div>
    </div>

    <script>
        // ⚠️ ضع رابط البوت بتاعك هنا (اللي طلعلك في المتصفح)
        const BOT_API_URL = 'http://51.75.118.18:20061/api/pair'; 

        async function generateCode() {
            const phoneInput = document.getElementById('phoneInput').value.trim();
            const btn = document.getElementById('generateBtn');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');
            const resultBox = document.getElementById('resultBox');

            // تصفير الرسائل القديمة
            resultBox.className = 'result-box';
            resultBox.innerText = '';

            if (!phoneInput) {
                resultBox.classList.add('result-error');
                resultBox.innerText = 'يرجى إدخال رقم الهاتف أولاً!';
                return;
            }

            // تغيير شكل الزر أثناء التحميل
            btn.disabled = true;
            btnText.innerText = 'جاري التوليد...';
            loader.style.display = 'block';

            try {
                const response = await fetch(BOT_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phoneInput })
                });

                const data = await response.json();

                if (data.code) {
                    // نجاح
                    resultBox.classList.add('result-success');
                    resultBox.innerHTML = `كود التنصيب الخاص بك:<br><br><span style="font-size: 24px; letter-spacing: 2px;">${data.code}</span>`;
                } else {
                    // خطأ من البوت
                    throw new Error(data.error || 'حدث خطأ غير متوقع');
                }

            } catch (error) {
                // فشل الاتصال أو خطأ في البوت
                resultBox.classList.add('result-error');
                resultBox.innerText = error.message || 'تعذر الاتصال بالسيرفر. تأكد أن البوت شغال.';
            } finally {
                // إرجاع الزر لحالته الطبيعية
                btn.disabled = false;
                btnText.innerText = 'توليد الكود 🚀';
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
