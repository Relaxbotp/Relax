<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RELAX | شات الدعم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* =========== المتغيرات الأساسية =========== */
        :root {
            --bg-color: #0a0a0f;
            --card-bg: rgba(20, 20, 30, 0.85);
            --primary: #8a2be2;
            --primary-glow: rgba(138, 43, 226, 0.5);
            --secondary: #00ffff;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --user-bubble: linear-gradient(135deg, #8a2be2, #4b0082);
            --dev-bubble: #1f2937;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #1a103c 0%, var(--bg-color) 70%);
            color: var(--text-main);
            height: 100dvh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========== حاوية الشات الأساسية =========== */
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 100dvh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            border-right: 1px solid var(--border-color);
            border-left: 1px solid var(--border-color);
        }

        @media (min-width: 768px) {
            .chat-container { height: 90vh; border-radius: 24px; border: 1px solid var(--border-color); }
        }

        /* =========== الهيدر (رأس الشات) =========== */
        .chat-header {
            background: rgba(15, 15, 25, 0.95);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .avatar-box {
            position: relative;
        }

        .avatar-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .online-indicator {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            background-color: #00ff88;
            border-radius: 50%;
            border: 2px solid var(--bg-color);
            box-shadow: 0 0 10px #00ff88;
        }

        .header-info h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .header-info p {
            font-size: 12px;
            color: #00ff88;
            font-weight: 600;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 20px;
            cursor: pointer;
            margin-right: auto;
            display: none;
        }

        /* =========== منطقة الرسائل =========== */
        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
            background-image: url('https://i.pinimg.com/736x/8f/1a/64/8f1a64e6c75e224499e6f4983a88493b.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .chat-body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 15, 0.88);
            z-index: 0;
        }

        /* =========== فقاعات الرسائل =========== */
        .message {
            position: relative;
            z-index: 1;
            max-width: 85%;
            padding: 10px 15px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.user {
            background: var(--user-bubble);
            align-self: flex-start;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.2);
        }

        .message.dev {
            background: var(--dev-bubble);
            align-self: flex-end;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .message .time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            display: block;
            text-align: left;
            margin-top: 5px;
        }

        /* =========== مشغل الصوت =========== */
        .audio-player {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 12px;
            min-width: 200px;
            margin-top: 5px;
            border: 1px solid var(--border-color);
        }

        .play-btn {
            background: var(--secondary);
            color: #000;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .play-btn:active { transform: scale(0.9); }

        .audio-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .audio-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .audio-bar-fill {
            height: 100%;
            background: var(--secondary);
            border-radius: 2px;
            width: 0%;
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
        }

        .audio-time {
            font-size: 10px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }

        audio { display: none; }

        /* =========== الفوتر (خانة الكتابة) =========== */
        .chat-footer {
            background: rgba(15, 15, 25, 0.95);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid var(--border-color);
            z-index: 10;
            position: relative;
        }

        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 12px 18px;
            border-radius: 25px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            font-family: 'Cairo', sans-serif;
            transition: 0.3s;
        }

        .chat-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .action-btn {
            background: var(--primary);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
            flex-shrink: 0;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .action-btn:active { transform: scale(0.9); }

        .mic-btn {
            background: var(--secondary);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 255, 255, 0.3);
        }

        .mic-btn.recording {
            background: #ff0055;
            color: white;
            animation: pulseRed 1s infinite;
        }

        @keyframes pulseRed {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 0, 85, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
        }

        .recording-timer {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff0055;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            display: none;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
            z-index: 20;
        }

        /* =========== شاشة إدخال الاسم =========== */
        .name-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            z-index: 100;
            text-align: center;
            transition: 0.5s;
        }

        .name-screen h2 { font-size: 24px; color: var(--secondary); margin-bottom: 10px; }
        .name-screen p { color: var(--text-muted); margin-bottom: 25px; font-size: 14px; }

        .name-screen input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: #111;
            color: white;
            text-align: center;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
        }
        .name-screen input:focus { border-color: var(--primary); }

        .name-screen button {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* =========== لوحة تحكم المطور (Admin List) =========== */
        .admin-list-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-color);
            z-index: 50;
            display: none;
            flex-direction: column;
        }

        .admin-header {
            padding: 20px;
            background: rgba(15, 15, 25, 0.95);
            border-bottom: 1px solid var(--border-color);
            font-size: 18px;
            font-weight: bold;
            color: var(--secondary);
            text-align: center;
        }

        .admin-chat-item {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: 0.2s;
        }

        .admin-chat-item:hover { background: rgba(255, 255, 255, 0.05); }

        .admin-chat-info { flex: 1; }
        .admin-chat-name { font-weight: bold; font-size: 15px; margin-bottom: 3px; }
        .admin-chat-msg { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

        .unread-badge {
            background: var(--secondary);
            color: #000;
            font-size: 12px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        
        <!-- واجهة إدخال الاسم (للمستخدم) -->
        <div class="name-screen" id="nameScreen">
            <h2>مرحباً بك في الدعم! 👋</h2>
            <p>من فضلك اكتب اسمك للبدء في المحادثة</p>
            <input type="text" id="userNameInput" placeholder="اكتب اسمك هنا...">
            <button onclick="saveUserName()">بدء المحادثة</button>
        </div>

        <!-- قائمة العملاء (للمطور) -->
        <div class="admin-list-screen" id="adminListScreen">
            <div class="admin-header">قائمة العملاء (لوحة المطور)</div>
            <div id="adminChatsList" style="flex: 1; overflow-y: auto;">
                <!-- سيتم إضافة العملاء هنا -->
            </div>
        </div>

        <!-- الهيدر -->
        <div class="chat-header">
            <button class="back-btn" id="backBtn" onclick="goBackToAdminList()">➤</button>
            <div class="avatar-box">
                <img src="https://i.pinimg.com/736x/8f/1a/64/8f1a64e6c75e224499e6f4983a88493b.jpg" class="avatar-img" id="headerAvatar">
                <div class="online-indicator"></div>
            </div>
            <div class="header-info">
                <h3 id="chatHeaderTitle">جاري التحميل...</h3>
                <p id="chatHeaderStatus">متصل الآن</p>
            </div>
        </div>

        <!-- منطقة الرسائل -->
        <div class="chat-body" id="chatBody"></div>

        <!-- الفوتر (الكتابة والتسجيل) -->
        <div class="chat-footer">
            <div class="recording-timer" id="recordingTimer">00:00</div>
            <input type="text" class="chat-input" id="chatInput" placeholder="اكتب رسالتك..." onkeypress="handleEnter(event)">
            <button class="action-btn" onclick="sendMessage()" id="sendBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2,21L23,12L2,3V10L17,12L2,14V21Z" /></svg>
            </button>
            <button class="action-btn mic-btn" id="micBtn" onclick="toggleRecording()">
                🎙️
            </button>
        </div>
    </div>

    <!-- سكريبت Firebase والشات -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, onValue, update, set, get, child, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ⚠️ إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyBxdcYywv3ljnR4MMiYw6UammlfFVFmLA4",
            authDomain: "relax-chat-72d0d.firebaseapp.com",
            databaseURL: "https://relax-chat-72d0d-default-rtdb.firebaseio.com",
            projectId: "relax-chat-72d0d",
            storageBucket: "relax-chat-72d0d.firebasestorage.app",
            messagingSenderId: "589292109",
            appId: "1:589292109:web:ff9296d174810cf34c7204"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const ADMIN_PASSWORD = "123456789mm*";
        let isAdmin = false;
        let currentUserId = null;
        let activeAdminChatId = null;
        let isChatInitialized = false;

        // عناصر الواجهة
        const nameScreen = document.getElementById('nameScreen');
        const adminListScreen = document.getElementById('adminListScreen');
        const adminChatsList = document.getElementById('adminChatsList');
        const chatBody = document.getElementById('chatBody');
        const chatInput = document.getElementById('chatInput');
        const chatHeaderTitle = document.getElementById('chatHeaderTitle');
        const chatHeaderStatus = document.getElementById('chatHeaderStatus');
        const backBtn = document.getElementById('backBtn');
        const headerAvatar = document.getElementById('headerAvatar');
        const recordingTimer = document.getElementById('recordingTimer');
        const micBtn = document.getElementById('micBtn');

        // متغيرات التسجيل الصوتي
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let recordingInterval;
        let recordingSeconds = 0;

        // ================= التهيئة الأساسية =================
        function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            
            if (urlParams.get('admin') === 'true') {
                isAdmin = true;
                // إخفاء شاشة الاسم وإظهار لوحة المطور
                nameScreen.style.display = 'none';
                adminListScreen.style.display = 'flex';
                chatHeaderTitle.innerText = "لوحة التحكم";
                chatHeaderStatus.innerText = "اختر عميلاً";
                chatHeaderStatus.style.color = "orange";
                
                loadAdminChats();
            } else {
                // مستخدم عادي
                let storedId = localStorage.getItem('relax_user_id');
                let storedName = localStorage.getItem('relax_user_name');

                if (!storedId || !storedName) {
                    nameScreen.style.display = 'flex';
                    adminListScreen.style.display = 'none';
                } else {
                    currentUserId = storedId;
                    nameScreen.style.display = 'none';
                    adminListScreen.style.display = 'none';
                    chatHeaderTitle.innerText = "الدعم الفني | Relax";
                    startUserChat(storedId);
                }
            }
        }

        // ================= دوال المستخدم =================
        window.saveUserName = function() {
            const name = document.getElementById('userNameInput').value.trim();
            if(!name) return alert("اكتب اسمك أولاً!");

            const newId = 'user_' + Date.now();
            localStorage.setItem('relax_user_id', newId);
            localStorage.setItem('relax_user_name', name);
            
            // حفظ بيانات العميل في Firebase
            set(ref(db, 'chats/' + newId + '/profile'), {
                name: name,
                lastSeen: Date.now(),
                unreadAdmin: 0
            });

            currentUserId = newId;
            nameScreen.style.display = 'none';
            startUserChat(newId);
        }

        function startUserChat(userId) {
            chatBody.innerHTML = '';
            const msgRef = ref(db, 'chats/' + userId + '/messages');
            
            // الاستماع للرسائل الجديدة
            onChildAdded(msgRef, (snapshot) => {
                const data = snapshot.val();
                renderMessage(data, 'user');
                
                // تحديث حالة القراءة لو المستخدم فاتح الشات
                if (data.sender === 'dev') {
                    update(ref(db, 'chats/' + userId + '/profile'), { unreadUser: 0 });
                }
            });
        }

        // ================= دوال المطور (Admin) =================
        function loadAdminChats() {
            const chatsRef = ref(db, 'chats');
            
            // الاستماع لأي تغيير في قائمة المحادثات
            onValue(chatsRef, (snapshot) => {
                adminChatsList.innerHTML = '';
                if (snapshot.exists()) {
                    const chats = snapshot.val();
                    Object.keys(chats).forEach(userId => {
                        const chat = chats[userId];
                        const userName = chat.profile?.name || "عميل بدون اسم";
                        const unread = chat.profile?.unreadAdmin || 0;
                        
                        // آخر رسالة
                        let lastMsg = "لا توجد رسائل";
                        let lastMsgTime = 0;
                        if (chat.messages) {
                            const msgs = Object.values(chat.messages);
                            const last = msgs[msgs.length - 1];
                            if (last) {
                                lastMsg = last.text || "🎙️ رسالة صوتية";
                                lastMsgTime = last.time || 0;
                            }
                        }

                        const item = document.createElement('div');
                        item.className = 'admin-chat-item';
                        item.onclick = () => openAdminChat(userId, userName);
                        item.innerHTML = `
                            <div class="admin-chat-info">
                                <div class="admin-chat-name">${userName}</div>
                                <div class="admin-chat-msg">${lastMsg}</div>
                            </div>
                            ${unread > 0 ? `<div class="unread-badge">${unread}</div>` : ''}
                        `;
                        adminChatsList.appendChild(item);
                    });
                }
            });
        }

        function openAdminChat(userId, userName) {
            activeAdminChatId = userId;
            adminListScreen.style.display = 'none';
            chatHeaderTitle.innerText = "محادثة: " + userName;
            chatHeaderStatus.innerText = "ترد الآن...";
            chatHeaderStatus.style.color = "#ff0055";
            backBtn.style.display = 'block';

            chatBody.innerHTML = '';
            const msgRef = ref(db, 'chats/' + userId + '/messages');
            
            // تصفير عداد الرسائل غير المقروءة للمطور
            update(ref(db, 'chats/' + userId + '/profile'), { unreadAdmin: 0 });

            onChildAdded(msgRef, (snapshot) => {
                const data = snapshot.val();
                renderMessage(data, 'dev');
            });
        }

        window.goBackToAdminList = function() {
            activeAdminChatId = null;
            adminListScreen.style.display = 'flex';
            chatHeaderTitle.innerText = "لوحة التحكم";
            chatHeaderStatus.innerText = "اختر عميلاً";
            chatHeaderStatus.style.color = "orange";
            backBtn.style.display = 'none';
            chatBody.innerHTML = '';
        }

        // ================= عرض الرسائل =================
        function renderMessage(data, viewType) {
            const isMe = (viewType === 'user' && data.sender === 'user') || (viewType === 'dev' && data.sender === 'dev');
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isMe ? 'user' : 'dev'}`;

            if (data.isAudio) {
                const uniqueId = 'audio_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
                const mins = Math.floor((data.duration || 0) / 60);
                const secs = (data.duration || 0) % 60;
                const formattedDuration = `${mins < 10 ? '0'+mins : mins}:${secs < 10 ? '0'+secs : secs}`;

                msgDiv.innerHTML = `
                    <div class="audio-player">
                        <button class="play-btn" onclick="toggleAudio('${uniqueId}', this)">▶</button>
                        <div class="audio-info">
                            <div class="audio-bar-bg" onclick="seekAudio(event, '${uniqueId}')">
                                <div class="audio-bar-fill" id="fill_${uniqueId}"></div>
                            </div>
                            <div class="audio-time">
                                <span id="time_${uniqueId}">0:00</span>
                                <span>${formattedDuration}</span>
                            </div>
                        </div>
                        <audio id="${uniqueId}" src="${data.audioBase64}" ontimeupdate="updateAudioProgress('${uniqueId}')" onended="audioEnded('${uniqueId}', this.closest('.audio-player').querySelector('.play-btn'))"></audio>
                    </div>
                    <span class="time">${new Date(data.time).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}</span>
                `;
            } else {
                msgDiv.innerHTML = `${data.text} <span class="time">${new Date(data.time).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}</span>`;
            }

            chatBody.appendChild(msgDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        // ================= إرسال رسالة =================
        window.sendMessage = async function() {
            const text = chatInput.value.trim();
            if (!text) return;
            
            let targetId = isAdmin ? activeAdminChatId : currentUserId;
            if (!targetId) return alert("حدث خطأ في تحديد المحادثة.");

            chatInput.value = '';
            const msgRef = ref(db, 'chats/' + targetId + '/messages');

            try {
                await push(msgRef, {
                    sender: isAdmin ? 'dev' : 'user',
                    text: text,
                    isAudio: false,
                    time: Date.now()
                });

                // زيادة عداد غير المقروء للطرف الآخر
                const profileRef = ref(db, 'chats/' + targetId + '/profile');
                const profileSnap = await get(profileRef);
                if (profileSnap.exists()) {
                    const unreadKey = isAdmin ? 'unreadUser' : 'unreadAdmin';
                    const currentUnread = profileSnap.val()[unreadKey] || 0;
                    update(profileRef, { [unreadKey]: currentUnread + 1 });
                }

            } catch (e) {
                console.error(e);
                alert("تعذر إرسال الرسالة، تحقق من اتصالك بالإنترنت.");
            }
        }

        window.handleEnter = function(e) {
            if (e.key === 'Enter') window.sendMessage();
        }

        // ================= التسجيل الصوتي =================
        window.toggleRecording = async function() {
            if (isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
                micBtn.innerHTML = "🎙️";
                clearInterval(recordingInterval);
                recordingTimer.style.display = 'none';
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    
                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        audioChunks = [];
                        
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = async () => {
                            const base64Audio = reader.result;
                            let targetId = isAdmin ? activeAdminChatId : currentUserId;
                            if (!targetId) return;

                            const msgRef = ref(db, 'chats/' + targetId + '/messages');
                            await push(msgRef, {
                                sender: isAdmin ? 'dev' : 'user',
                                isAudio: true,
                                audioBase64: base64Audio,
                                duration: recordingSeconds,
                                time: Date.now()
                            });

                            // زيادة عداد غير المقروء
                            const profileRef = ref(db, 'chats/' + targetId + '/profile');
                            const profileSnap = await get(profileRef);
                            if (profileSnap.exists()) {
                                const unreadKey = isAdmin ? 'unreadUser' : 'unreadAdmin';
                                const currentUnread = profileSnap.val()[unreadKey] || 0;
                                update(profileRef, { [unreadKey]: currentUnread + 1 });
                            }
                        };
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add('recording');
                    micBtn.innerHTML = "🛑";
                    
                    recordingSeconds = 0;
                    recordingTimer.innerText = "00:00";
                    recordingTimer.style.display = 'block';
                    recordingInterval = setInterval(() => {
                        recordingSeconds++;
                        let mins = Math.floor(recordingSeconds / 60);
                        let secs = recordingSeconds % 60;
                        recordingTimer.innerText = `${mins < 10 ? '0'+mins : mins}:${secs < 10 ? '0'+secs : secs}`;
                    }, 1000);

                } catch (err) {
                    alert("❌ تم رفض إذن الميكروفون. يرجى السماح بالوصول من إعدادات المتصفح.");
                }
            }
        }

        // ================= دوال مشغل الصوت =================
        window.toggleAudio = function(id, btn) {
            const audio = document.getElementById(id);
            if (audio.paused) {
                document.querySelectorAll('audio').forEach(a => {
                    if (a.id !== id) {
                        a.pause();
                        const parent = a.closest('.audio-player');
                        if(parent) parent.querySelector('.play-btn').innerHTML = '▶';
                    }
                });
                audio.play();
                btn.innerHTML = '⏸';
            } else {
                audio.pause();
                btn.innerHTML = '▶';
            }
        }

        window.updateAudioProgress = function(id) {
            const audio = document.getElementById(id);
            const fill = document.getElementById('fill_' + id);
            const timeDisplay = document.getElementById('time_' + id);
            
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                fill.style.width = percent + '%';
                
                let mins = Math.floor(audio.currentTime / 60);
                let secs = Math.floor(audio.currentTime % 60);
                if (secs < 10) secs = '0' + secs;
                timeDisplay.innerText = `${mins}:${secs}`;
            }
        }

        window.audioEnded = function(id, btn) {
            btn.innerHTML = '▶';
            document.getElementById('fill_' + id).style.width = '0%';
            document.getElementById('time_' + id).innerText = '0:00';
        }

        window.seekAudio = function(event, id) {
            const bar = event.currentTarget;
            const rect = bar.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const percent = clickX / rect.width;
            const audio = document.getElementById(id);
            if(audio.duration) audio.currentTime = percent * audio.duration;
        }

        // تشغيل التطبيق
        initApp();
    </script>
</body>
</html>
