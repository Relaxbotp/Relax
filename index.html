<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RELAX // PRO MAX PAIRING TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        :root {
            --crimson: #ff083a;
            --crimson-bright: #ff3b63;
            --crimson-deep: #660015;
            --obsidian: #070709;
            --panel: rgba(14, 14, 19, 0.78);
            --panel-elevated: rgba(22, 22, 30, 0.9);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-crimson: rgba(255, 8, 58, 0.38);
            --text-main: #f5f5f7;
            --text-muted: #9898a6;
            --wa-green: #25d366;
        }

        body {
            background-color: var(--obsidian);
            background-image:
                radial-gradient(circle at 50% 0%, rgba(255, 8, 58, 0.18), transparent 55%),
                linear-gradient(rgba(7, 7, 9, 0.86), rgba(7, 7, 9, 0.96)),
                url('https://i.pinimg.com/736x/00/38/23/00382364ea86499ba8fcd6ce77eb4923.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* شبكة تقنية دقيقة تعطي عمقاً معمارياً بدون إزعاج بصري */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: radial-gradient(circle at 50% 35%, black 35%, transparent 85%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: var(--panel);
            padding: 24px 22px 26px;
            border-radius: 26px;
            border: 1px solid var(--border-subtle);
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.75),
                0 0 0 1px rgba(255, 8, 58, 0.14),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            text-align: center;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(22px) saturate(140%);
            z-index: 1;
        }

        /* خط علوي متدرج بنبض خفيف */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 12%;
            right: 12%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--crimson), var(--crimson-bright), var(--crimson), transparent);
            box-shadow: 0 0 18px var(--crimson);
        }

        /* شريط حالة النظام العلوي */
        .hud-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 12px;
            margin-bottom: 20px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            font-size: 11px;
            color: var(--text-muted);
        }

        .hud-live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--crimson-bright);
            font-weight: 700;
        }

        .hud-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--crimson);
            box-shadow: 0 0 10px var(--crimson);
            animation: hudPulse 1.8s infinite;
        }

        @keyframes hudPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.35); opacity: 0.55; }
        }

        .hud-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        /* بطاقة الهوية */
        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 14px;
            position: relative;
        }

        .avatar-ring {
            position: relative;
            width: 114px;
            height: 114px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-ring::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            padding: 2.5px;
            background: conic-gradient(from 0deg, var(--crimson), transparent 45%, var(--crimson-bright), transparent 80%, var(--crimson));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: ringSpin 9s linear infinite;
        }

        @keyframes ringSpin {
            to { transform: rotate(360deg); }
        }

        .profile-image {
            width: 102px;
            height: 102px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(255, 8, 58, 0.35);
            background-color: #16161d;
        }

        .brand-name {
            font-family: 'JetBrains Mono', 'Cairo', sans-serif;
            font-size: 34px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 6px;
            margin-top: 12px;
            text-shadow: 0 0 24px rgba(255, 8, 58, 0.55);
            line-height: 1.1;
        }

        .subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* الإحصائيات */
        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
            width: 100%;
        }

        .stat-box {
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.04), rgba(255, 8, 58, 0.03));
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 14px 12px;
            text-align: center;
            position: relative;
            transition: border-color 0.25s ease, transform 0.25s ease;
        }

        .stat-box:hover {
            border-color: var(--border-crimson);
            transform: translateY(-2px);
        }

        .stat-value {
            font-family: 'JetBrains Mono', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 16px rgba(255, 8, 58, 0.45);
            margin-bottom: 4px;
            display: block;
            line-height: 1.15;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        /* حقل إدخال الرقم وزر التوليد */
        .input-group {
            margin-bottom: 14px;
            position: relative;
        }

            color: #fff;
            font-family: 'JetBrains Mono', 'Cairo', sans-serif;

            font-weight: 700;
