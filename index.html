<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cinematic Player | مشغل الفيديوهات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --panel: rgba(20, 20, 25, 0.7);
            --primary: #8b5cf6; /* نيون بنفسجي */
            --secondary: #06b6d4; /* نيون سماوي */
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --glow: 0 0 20px rgba(139, 92, 246, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(139,92,246,0.15) 0%, transparent 50%);
        }

        header { text-align: center; margin-bottom: 30px; margin-top: 20px; }
        header h1 { 
            font-size: 36px; 
            font-weight: 900; 
            background: linear-gradient(90deg, #a78bfa, #22d3ee); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            margin-bottom: 10px; 
            filter: drop-shadow(0 0 10px rgba(167, 139, 250, 0.5));
        }
        header p { color: var(--text-muted); font-size: 15px; }

        /* صندوق البحث */
        .search-box { 
            width: 100%; 
            max-width: 800px; 
            display: flex; 
            gap: 10px; 
            margin-bottom: 30px; 
            background: var(--panel);
            padding: 10px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .search-box input {
            flex: 1; padding: 15px 20px; border-radius: 12px; border: none;
            background: rgba(0,0,0,0.3); color: #fff; font-size: 16px; outline: none; transition: 0.3s; font-family: 'Cairo';
        }
        .search-box input:focus { background: rgba(0,0,0,0.6); }
        .search-box button {
            padding: 0 30px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center;
            box-shadow: var(--glow);
        }
        .search-box button:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(139, 92, 246, 0.7); }

        /* مشغل الفيديو */
        .player-container {
            width: 100%; max-width: 900px; background: var(--panel); border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1); overflow: hidden; position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); display: none; flex-direction: column;
            backdrop-filter: blur(15px);
        }
        .player-container.active { display: flex; animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .video-wrapper { 
            position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; 
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        .video-wrapper iframe, .video-wrapper video { width: 100%; height: 100%; border: none; object-fit: contain; }
        
        /* زرار التحميل فوق الفيديو */
        .overlay-download-btn {
            position: absolute; top: 15px; right: 15px; 
            background: rgba(0,0,0,0.7); color: #fff; border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 20px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 14px;
            display: none; align-items: center; gap: 8px; backdrop-filter: blur(5px); transition: 0.3s; z-index: 10;
        }
        .overlay-download-btn:hover { background: var(--primary); border-color: var(--primary); }

        .controls { 
            padding: 20px; display: flex; justify-content: space-between; align-items: center; 
            flex-wrap: wrap; gap: 15px; background: rgba(0,0,0,0.4); border-top: 1px solid rgba(255,255,255,0.05);
        }
        
        .quality-selector { display: flex; align-items: center; gap: 10px; }
        .quality-selector label { font-size: 14px; color: var(--text-muted); font-weight: bold; }
        .quality-selector select {
            padding: 10px 15px; border-radius: 10px; background: #000; color: #fff; border: 1px solid var(--primary);
            outline: none; font-family: 'Cairo'; font-size: 14px; cursor: pointer; box-shadow: inset 0 0 10px rgba(139,92,246,0.2);
        }

        .status-text { font-size: 14px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; font-weight: bold; }
        .status-text.success { color: #10b981; }
        .status-text.error { color: #ef4444; }

        /* رسالة الخطأ */
        .error-msg { width: 100%; max-width: 800px; padding: 15px; border-radius: 12px; background: rgba(239,68,68,0.1); border: 1px solid #ef4444; color: #ef4444; text-align: center; display: none; margin-bottom: 20px; font-weight: bold; }
        .error-msg.active { display: block; animation: fadeIn 0.3s; }

        /* Loader */
        .loader { display: flex; flex-direction: column; align-items: center; gap: 15px; color: #fff; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <header>
        <h1>Cinematic Player</h1>
        <p>ضع رابط الفيديو وشاهده أو حمله بجودة عالية</p>
    </header>

    <div class="error-msg" id="errorMsg"></div>

    <div class="search-box">
        <input type="text" id="videoUrl" placeholder="الصق رابط (يوتيوب، تيك توك، أو MP4)..." onkeypress="handleEnter(event)">
        <button onclick="loadVideo()">تشغيل ▶</button>
    </div>

    <div class="player-container" id="playerContainer">
        <div class="video-wrapper" id="videoWrapper">
            <!-- الفيديو أو الـ iframe هيتحط هنا -->
            <a href="#" id="downloadBtn" class="overlay-download-btn" target="_blank">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                تحميل
            </a>
        </div>
        
        <div class="controls">
            <div class="status-text" id="statusText">جاهز للتشغيل</div>
            
            <div class="quality-selector" id="qualityBox" style="display: none;">
                <label>الجودة:</label>
                <select id="qualitySelect" onchange="changeQuality()">
                    <!-- الخيارات هتتحط هنا بالـ JS -->
                </select>
            </div>
        </div>
    </div>

    <script>
        const videoUrlInput = document.getElementById('videoUrl');
        const playerContainer = document.getElementById('playerContainer');
        const videoWrapper = document.getElementById('videoWrapper');
        const statusText = document.getElementById('statusText');
        const errorMsg = document.getElementById('errorMsg');
        const qualityBox = document.getElementById('qualityBox');
        const qualitySelect = document.getElementById('qualitySelect');
        const downloadBtn = document.getElementById('downloadBtn');

        let currentTikTokData = null;
        let currentDirectUrl = '';

        function handleEnter(e) {
            if (e.key === 'Enter') loadVideo();
        }

        function showError(msg) {
            errorMsg.innerText = msg;
            errorMsg.classList.add('active');
            playerContainer.classList.remove('active');
            setTimeout(() => errorMsg.classList.remove('active'), 6000);
        }

        function showLoader() {
            videoWrapper.innerHTML = `
                <div class="loader">
                    <div class="spinner"></div>
                    <span>⏳ جاري جلب الفيديو...</span>
                </div>
            `;
            downloadBtn.style.display = 'none';
        }

        async function loadVideo() {
            const url = videoUrlInput.value.trim();
            errorMsg.classList.remove('active');
            qualityBox.style.display = 'none';
            downloadBtn.style.display = 'none';

            if (!url) return showError('الرجاء إدخال رابط الفيديو أولاً.');

            playerContainer.classList.add('active');
            showLoader();
            statusText.innerText = 'جاري التحميل...';
            statusText.className = 'status-text';

            try {
                // 1. يوتيوب
                if (url.includes('youtube.com') || url.includes('youtu.be')) {
                    let videoId = '';
                    if (url.includes('youtu.be')) {
                        videoId = url.split('youtu.be/')[1].split('?')[0];
                    } else {
                        const urlParams = new URLSearchParams(new URL(url).search);
                        videoId = urlParams.get('v');
                    }
                    
                    if (!videoId) throw new Error("رابط يوتيوب غير صالح");

                    videoWrapper.innerHTML = `
                        <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                    `;
                    statusText.innerText = 'يتم التشغيل من يوتيوب (الجودة تلقائية)';
                    statusText.classList.add('success');
                }
                
                // 2. تيك توك
                else if (url.includes('tiktok.com')) {
                    const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
                    const data = await response.json();

                    if (data.code !== 0) throw new Error("مقدرتش أجيب الفيديو، تأكد من اللينك.");

                    currentTikTokData = data.data;

                    qualitySelect.innerHTML = '';
                    if (currentTikTokData.hdplay) qualitySelect.innerHTML += `<option value="hd">HD (عالي)</option>`;
                    if (currentTikTokData.play) qualitySelect.innerHTML += `<option value="sd">SD (عادي)</option>`;
                    if (currentTikTokData.music) qualitySelect.innerHTML += `<option value="audio">صوت فقط (MP3)</option>`;
                    
                    qualityBox.style.display = 'flex';
                    playTikTokVideo('hd'); 

                    statusText.innerText = 'تم جلب الفيديو من تيك توك بنجاح';
                    statusText.classList.add('success');
                }

                // 3. رابط مباشر
                else if (url.match(/\.(mp4|webm|ogg)$/i) || url.includes('.mp4')) {
                    currentDirectUrl = url;
                    videoWrapper.innerHTML = `<video src="${url}" controls autoplay playsinline></video>`;
                    downloadBtn.href = url;
                    downloadBtn.style.display = 'flex';
                    statusText.innerText = 'يتم التشغيل كرابط مباشر';
                    statusText.classList.add('success');
                }

                else {
                    throw new Error("الموقع ده مش مدعوم حالياً. جرب يوتيوب، تيك توك، أو رابط MP4.");
                }

            } catch (error) {
                showError(error.message);
            }
        }

        function playTikTokVideo(type) {
            if (!currentTikTokData) return;

            let videoUrl = '';
            let isAudio = false;

            if (type === 'hd' && currentTikTokData.hdplay) videoUrl = currentTikTokData.hdplay;
            else if (type === 'sd' && currentTikTokData.play) videoUrl = currentTikTokData.play;
            else if (type === 'audio' && currentTikTokData.music) { videoUrl = currentTikTokData.music; isAudio = true; }

            if (videoUrl) {
                if (isAudio) {
                     videoWrapper.innerHTML = `
                        <div style="text-align:center; padding: 20px; width: 100%; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                            <img src="${currentTikTokData.cover}" style="width: 200px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                            <audio src="${videoUrl}" controls autoplay style="width: 100%; max-width: 500px;"></audio>
                        </div>
                    `;
                } else {
                    // ضفنا poster عشان لو الفيديو اتمنع تظهر الصورة
                    videoWrapper.innerHTML = `
                        <video src="${videoUrl}" poster="${currentTikTokData.cover}" controls autoplay playsinline></video>
                    `;
                }
                
                // تحديث زرار التحميل
                downloadBtn.href = videoUrl;
                downloadBtn.style.display = 'flex';
            }
        }

        function changeQuality() {
            playTikTokVideo(qualitySelect.value);
        }
    </script>
</body>
</html>
